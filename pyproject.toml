[project]
name = "douyin-agent"
version = "0.1.0"
description = "Local single-account Douyin agent with a human-scale policy engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "playwright>=1.50.0",
  "openai>=1.60.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sse-starlette>=2.2.0",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
